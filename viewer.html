<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>alley asset viewer</title>
    <style>
      html, body { margin: 0; background: #0b0e12; color: #9fb4b8;
        font-family: ui-monospace, Menlo, monospace; }
      #app { padding: 10px; }
      #app canvas { display: block; border: 1px solid #1e2630; border-radius: 6px; }
      #title { font-size: 12px; letter-spacing: 0.1em; color: #7fd4c8; margin-bottom: 8px; }
      a { color: #9fd8ff; text-decoration: none; }
      a:hover { color: #fff; }
      /* Dense square grid: 5 columns on desktop, 1:1 thumbs */
      #grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
      @media (max-width: 1100px) { #grid { grid-template-columns: repeat(4, 1fr); } }
      @media (max-width: 700px) { #grid { grid-template-columns: repeat(3, 1fr); } }
      .cell { display: block; background: #11151b; border: 1px solid #1e2630; border-radius: 6px;
        overflow: hidden; color: #9fb4b8; }
      .cell:hover { border-color: #37e6ff; }
      .cell .thumb { aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center;
        background: #181c22; overflow: hidden; }
      .cell .thumb canvas { display: block; width: 100%; height: 100%; object-fit: cover;
        border: none; border-radius: 0; }
      .cell span { display: block; padding: 4px 6px; font-size: 10px; letter-spacing: 0.04em;
        color: #7fd4c8; background: #0d1116; white-space: nowrap; overflow: hidden;
        text-overflow: ellipsis; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/viewer.ts"></script>
  </body>
</html>
