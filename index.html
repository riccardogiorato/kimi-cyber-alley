<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#060a0c" />
    <title>kimi-cyber-alley</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #060a0c; overflow: hidden; }
      /* Fill the visual viewport on iOS (dynamic toolbars) and avoid bounce/scroll. */
      html, body { height: 100dvh; }
      body { position: fixed; inset: 0; touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      canvas { display: block; touch-action: none; }
      #overlay {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #b8e6e0; font-family: ui-monospace, Menlo, monospace; font-size: 14px;
        background: rgba(4, 8, 10, 0.55); cursor: pointer; user-select: none;
        letter-spacing: 0.08em; text-align: center; line-height: 1.9;
        transition: opacity 0.25s ease; z-index: 10; padding: 0 24px;
      }
      #overlay.hidden { opacity: 0; pointer-events: none; }
      #overlay .hint { opacity: 0.65; font-size: 12px; }

      /* Always-on FPS counter, top-left, legible on any background. */
      #fps {
        position: fixed; top: max(8px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left));
        z-index: 20; color: #9fe8dd; font-family: ui-monospace, Menlo, monospace;
        font-size: 11px; letter-spacing: 0.06em; padding: 3px 7px;
        background: rgba(4, 10, 12, 0.5); border: 1px solid rgba(120, 220, 205, 0.22);
        border-radius: 4px; pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      }

      /* Touch controls — only shown on coarse-pointer (touch) devices. */
      #touch { display: none; }
      body.touch #touch { display: block; }
      #stick {
        position: fixed; z-index: 15; width: 116px; height: 116px; border-radius: 50%;
        border: 1.5px solid rgba(140, 230, 215, 0.35); background: rgba(8, 16, 18, 0.25);
        bottom: max(20px, env(safe-area-inset-bottom)); left: max(20px, env(safe-area-inset-left));
        pointer-events: none; opacity: 0.85;
      }
      #stick .nub {
        position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; border-radius: 50%;
        background: rgba(150, 235, 220, 0.4); border: 1px solid rgba(180, 245, 230, 0.6);
        transform: translate(-50%, -50%);
      }
      #lookhint {
        position: fixed; z-index: 14; right: max(18px, env(safe-area-inset-right));
        bottom: max(28px, env(safe-area-inset-bottom)); color: rgba(160, 230, 220, 0.5);
        font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: 0.08em;
        pointer-events: none; text-align: right; text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      }
    </style>
  </head>
  <body>
    <div id="fps">-- FPS</div>
    <div id="overlay"><span>CLICK TO ENTER THE ALLEY<br /><span class="hint">WASD move &middot; SHIFT run &middot; ESC release</span></span></div>
    <div id="touch">
      <div id="stick"><div class="nub"></div></div>
      <div id="lookhint">drag right side<br />to look</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
